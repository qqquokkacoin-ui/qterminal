<!DOCTYPE html>
<html lang="en" class="landing-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QTERMINAL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">
  <div class="landing">
    <canvas id="starfield"></canvas>
    <div class="landing-content">
      <div class="qt-title">QTERMINAL</div>
      <button class="enter-btn" id="enterBtn">PRESS TO ENTER</button>
    </div>
    <div class="scroll-cue">$QUOKKA</div>
  </div>

  <!-- ================================================================
       COIN INFO SECTION
       Edit the CONFIG object in js/coin-config.js with the real
       contract address, chain, and links once you've got them —
       everything here reads from that one file.
       ================================================================ -->
  <div class="coin-section">
    <div class="coin-inner">
      <div class="coin-eyebrow">THE COIN BEHIND QTERMINAL</div>
      <div class="coin-ticker" id="coinTicker">$QUOKKA</div>
      <div class="coin-tagline" id="coinTagline">
        QuokkaOnHood — the community coin powering Qterminal. Follow along on X for updates.
      </div>
      <div class="coin-qqq-note">Linked to Robinhood's tokenized QQQ — Invesco QQQ Trust, on-chain.</div>

      <div class="coin-links" id="coinLinks"></div>

      <div class="coin-ca-box" id="coinCaBox">
        <span class="ca-label">CONTRACT ADDRESS</span>
        <span id="coinCaText">— not set yet —</span>
      </div>
    </div>
  </div>

  <script src="js/coin-config.js"></script>
  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const STAR_COUNT = 140;
    const stars = Array.from({ length: STAR_COUNT }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() < 0.15 ? 2 : 1,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.2
    }));

    let shootingStars = [];
    function spawnShootingStar() {
      const startX = Math.random() * w * 0.7;
      const startY = Math.random() * h * 0.4;
      shootingStars.push({
        x: startX, y: startY,
        len: 40 + Math.random() * 60,
        speed: 6 + Math.random() * 5,
        angle: Math.PI / 5,
        life: 1
      });
    }
    setInterval(() => {
      if (Math.random() < 0.6) spawnShootingStar();
    }, 1800);

    let t = 0;
    function draw() {
      t += 0.02;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      for (const s of stars) {
        const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * s.speed + s.phase));
        ctx.fillStyle = `rgba(255,255,255,${twinkle.toFixed(2)})`;
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
      }

      shootingStars.forEach(st => {
        st.x += Math.cos(st.angle) * st.speed;
        st.y += Math.sin(st.angle) * st.speed;
        st.life -= 0.02;
        if (st.life > 0) {
          const tailX = st.x - Math.cos(st.angle) * st.len;
          const tailY = st.y - Math.sin(st.angle) * st.len;
          const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255,178,56,${st.life})`);
          grad.addColorStop(1, 'rgba(255,178,56,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(st.x, st.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();
        }
      });
      shootingStars = shootingStars.filter(st => st.life > 0 && st.y < h + 50);

      requestAnimationFrame(draw);
    }
    draw();

    document.getElementById('enterBtn').addEventListener('click', () => {
      window.location.href = 'globe.html';
    });

    // ---- render coin links from config ----
    (function renderCoinSection() {
      document.getElementById('coinTicker').textContent = COIN_CONFIG.ticker;
      document.getElementById('coinTagline').textContent = COIN_CONFIG.tagline;
      document.getElementById('coinCaText').textContent = COIN_CONFIG.contractAddress || '— not set yet —';

      const links = [
        { key: 'x', label: 'X / TWITTER', url: COIN_CONFIG.links.x },
        { key: 'telegram', label: 'TELEGRAM', url: COIN_CONFIG.links.telegram },
        { key: 'dexscreener', label: 'DEXSCREENER', url: COIN_CONFIG.links.dexscreener },
        { key: 'binance', label: 'BINANCE', url: COIN_CONFIG.links.binance },
        { key: 'coinbase', label: 'COINBASE', url: COIN_CONFIG.links.coinbase },
      ];
      const container = document.getElementById('coinLinks');
      container.innerHTML = links.map(l => {
        const soon = COIN_CONFIG.soon && COIN_CONFIG.soon[l.key] && !l.url;
        const disabled = !l.url;
        return `<a class="coin-link ${disabled ? 'disabled' : ''}" href="${l.url || '#'}" target="_blank" rel="noopener">
          <span>${l.label}</span><span class="cl-arrow">${soon ? 'SOON' : (disabled ? '—' : '↗')}</span>
        </a>`;
      }).join('');
    })();
  </script>
</body>
</html>
